replicaCount: 1

fullnameOverride: auth-service

image:
  repository: 480815637772.dkr.ecr.ap-south-1.amazonaws.com/ghs
  tag: "auth-service-latest"
  pullPolicy: Always

containerPort: 8081

service:
  type: ClusterIP
  port: 8081

database:
  enabled: true
  host: "10.63.0.3"
  port: 5432
  name: auth_db
  existingSecret: ghs-db-secret
  usernameKey: username
  passwordKey: password

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi
