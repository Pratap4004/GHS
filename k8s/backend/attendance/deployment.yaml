apiVersion: apps/v1
kind: Deployment

metadata:
  name: attendance-service
  namespace: ghs
  labels:
    app: attendance-service

spec:
  replicas: 1

  selector:
    matchLabels:
      app: attendance-service

  template:
    metadata:
      labels:
        app: attendance-service

    spec:
      containers:
        - name: attendance-service
          image: asia-south1-docker.pkg.dev/project-e4b58c33-b31e-44d9-a36/ghs/attendance-service:6bcf1feec5c123180fa46612413db11e9486c0c8

          ports:
            - containerPort: 8084

          env:
            - name: DB_URL
              value: "jdbc:postgresql://10.43.206.2:5432/attendance_db"

            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: ghs-db-secret
                  key: DB_USERNAME

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ghs-db-secret
                  key: DB_PASSWORD
