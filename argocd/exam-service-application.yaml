apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: exam-service
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Pratap4004/GHS.git
    targetRevision: main
    path: helm/microservice
    helm:
      valueFiles:
        - values/exam-service.yaml
      parameters:
        - name: fullnameOverride
          value: exam-service
  destination:
    server: https://kubernetes.default.svc
    namespace: ghs
  syncPolicy:
    syncOptions:
      - CreateNamespace=false
