apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: postgres
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Pratap4004/GHS.git
    targetRevision: main
    path: gitops/postgres
    directory:
      recurse: false
  destination:
    server: https://kubernetes.default.svc
    namespace: ghs
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
