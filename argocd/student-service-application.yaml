apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: student-service
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/Pratap4004/GHS.git
    targetRevision: main
    path: helm/microservice
    helm:
      valueFiles:
        - values/student-service.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: ghs

  syncPolicy:
    syncOptions:
      - CreateNamespace=false
