name: Frontend Build and Push to GAR

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: project-e4b58c33-b31e-44d9-a36
  GAR_LOCATION: asia-south1
  GAR_REPOSITORY: ghs
  IMAGE_NAME: frontend

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout GitHub repository
      - name: Checkout source code
        uses: actions/checkout@v4

      # 2. Install Node.js on GitHub Actions runner
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 3. Install frontend dependencies
      # npm is available only on the GitHub Actions runner
      - name: Install dependencies
        working-directory: frontend
        run: npm install

      # 4. Run frontend tests
      - name: Run tests
        working-directory: frontend
        run: npm test

      # 5. Build React/Vite application
      # This creates frontend/dist/
      - name: Build frontend
        working-directory: frontend
        run: npm run build

      # 6. Authenticate GitHub Actions with Google Cloud
      # Uses Workload Identity Federation
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/142823644639/locations/global/workloadIdentityPools/github-actions-ghs/providers/github
          service_account: github-actions-ghs@project-e4b58c33-b31e-44d9-a36.iam.gserviceaccount.com

      # 7. Install/setup gcloud on GitHub Actions runner
      - name: Setup Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2

      # 8. Configure Docker authentication for Artifact Registry
      - name: Configure Docker authentication
        run: |
          gcloud auth configure-docker asia-south1-docker.pkg.dev --quiet

      # 9. Build Docker image
      # Dockerfile is inside frontend/
      # Build context is ./frontend
      - name: Build Docker image
        run: |
          docker build \
            -t asia-south1-docker.pkg.dev/$PROJECT_ID/$GAR_REPOSITORY/$IMAGE_NAME:${{ github.sha }} \
            ./frontend

      # 10. Push Docker image to Google Artifact Registry
      - name: Push Docker image to GAR
        run: |
          docker push \
            asia-south1-docker.pkg.dev/$PROJECT_ID/$GAR_REPOSITORY/$IMAGE_NAME:${{ github.sha }}
