name: Backend Build and Push to GAR

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: project-e4b58c33-b31e-44d9-a36
  GAR_LOCATION: asia-south1
  GAR_REPOSITORY: ghs

jobs:

  # ============================================================
  # Announcement Service
  # ============================================================

  announcement-service:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build and test Announcement Service
        working-directory: backend/announcement-service
        run: mvn clean package

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/142823644639/locations/global/workloadIdentityPools/github-actions-ghs/providers/github
          service_account: github-actions-ghs@project-e4b58c33-b31e-44d9-a36.iam.gserviceaccount.com

      - name: Configure Docker authentication
        run: gcloud auth configure-docker $GAR_LOCATION-docker.pkg.dev --quiet

      - name: Build Docker image
        working-directory: backend/announcement-service
        run: |
          docker build \
            -f Dockerfile \
            -t $GAR_LOCATION-docker.pkg.dev/$PROJECT_ID/$GAR_REPOSITORY/announcement-service:${{ github.sha }} \
            .

      - name: Push Docker image to GAR
        run: |
          docker push \
            $GAR_LOCATION-docker.pkg.dev/$PROJECT_ID/$GAR_REPOSITORY/announcement-service:${{ github.sha }}


