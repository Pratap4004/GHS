replicaCount: 1

fullnameOverride: homework-service

image:
  repository: 480815637772.dkr.ecr.ap-south-1.amazonaws.com/ghs
  tag: "homework-service-latest"
  pullPolicy: Always

containerPort: 8087

service:
  type: ClusterIP
  port: 8087

database:
  enabled: true
  host: "postgres"
  port: 5432
  name: ghs_db
  existingSecret: ghs-db-secret
  usernameKey: username
  passwordKey: password

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi
