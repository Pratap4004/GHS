apiVersion: apps/v1
kind: Deployment

metadata:
  name: auth-service
  namespace: ghs
  labels:
    app: auth-service

spec:
  replicas: 2

  selector:
    matchLabels:
      app: auth-service

  template:
    metadata:
      labels:
        app: auth-service

    spec:
      containers:
        - name: auth-service
          image: asia-south1-docker.pkg.dev/project-e4b58c33-b31e-44d9-a36/ghs/auth-service:6bcf1feec5c123180fa46612413db11e9486c0c8
          ports:
            - containerPort: 8081
