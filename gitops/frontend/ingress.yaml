apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ghs-ingress
  namespace: ghs
  annotations:
    kubernetes.io/ingress.class: "gce"
    kubernetes.io/ingress.global-static-ip-name: "ghs-ingress-global-ip"
spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
